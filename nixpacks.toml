# The agent harness bootstraps its CLI at runtime by shelling out to `pnpm`.
# Nixpacks otherwise provides it through corepack, whose shim dies on
# ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING when spawned from the server — so no
# agent turn could start in production. Declaring it here puts a real binary
# on PATH instead.
[phases.setup]
nixPkgs = ["nodejs_24", "pnpm"]
# Project covers are screenshots, and puppeteer's own Chrome download never
# happens here — so it launched nothing and every project stayed coverless.
# Debian's build brings its shared libraries with it, which the Chrome-for-
# Testing tarball does not on this image. The start command points puppeteer
# at it; see railway.json.
aptPkgs = ["chromium"]
