name: frontend
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/**'
  workflow_dispatch:
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run focused frontend tests
        working-directory: ./frontend
        shell: bash
        run: |
          shopt -s nullglob
          configs=(jest.*.config.js)
          if (( ${#configs[@]} == 0 )); then
            echo "No focused frontend test configurations in this revision"
          fi
          for config in "${configs[@]}"; do
            pnpm exec jest --config "$config" --runInBand
          done

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Run source checks
        run: pnpm check
      
      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ./frontend/.next
            ./frontend/node_modules
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
