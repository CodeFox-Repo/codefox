name: autofix.ci

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Find files changed by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' > "$RUNNER_TEMP/codefox-format-files"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' > "$RUNNER_TEMP/codefox-lint-files"

      - name: Format changed files with Prettier
        run: |
          mapfile -d '' files < "$RUNNER_TEMP/codefox-format-files"
          if (( ${#files[@]} )); then
            pnpm exec prettier --write --ignore-unknown "${files[@]}"
            git add -- "${files[@]}"
          fi

      - name: Run ESLint fix on changed files
        run: |
          mapfile -d '' files < "$RUNNER_TEMP/codefox-lint-files"
          if (( ${#files[@]} )); then
            pnpm exec eslint --resolve-plugins-relative-to backend --fix "${files[@]}"
            git add -- "${files[@]}"
          fi

      - name: Check frontend TypeScript
        run: pnpm exec tsc --project frontend/tsconfig.json --noEmit

      - name: Check backend TypeScript
        run: pnpm exec tsc --project backend/tsconfig.json --noEmit
      - uses: autofix-ci/action@dd55f44df8f7cdb7a6bf74c78677eb8acd40cd0a
